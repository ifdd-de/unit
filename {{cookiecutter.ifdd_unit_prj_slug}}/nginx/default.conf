# nginx server for {{ cookiecutter.ifdd_unit_prj_name }}.
#
# Serves the content directory mounted at /usr/share/nginx/html (see the
# compose files) read-only, behind the IFDD proxy. Changes here need
# `docker compose restart`; changes to the content do not.
{%- set origin = cookiecutter.ifdd_unit_cors_origin %}
{%- set max_age = cookiecutter.ifdd_unit_cache_max_age %}

# A vocabulary is one document per namespace, <namespace>/index.jsonld. A
# term IRI (<namespace>/<term>) has no file of its own and answers with the
# vocabulary of its namespace; the term is found there by its @id.
map $uri $vocabulary {
    ~^(?<namespace>.*/)[^/]+$  ${namespace}index.jsonld;
    default                    "";
}

server {
    # Unprivileged image: port 8080, not 80. IPv4 only on purpose: an
    # IPv6 listen socket fails to bind in containers without IPv6.
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    charset utf-8;
    # The namespace IRI itself (<namespace>/) answers with its vocabulary.
    index index.jsonld;
    # Relative Location headers: behind the proxy, nginx does not know the
    # public host (e.g. /v1/product -> /v1/product/).
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/ld+json application/json text/plain;

    # Container health check (see the compose files).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never serve hidden files or directories, above all the .git directory
    # of a content clone that is mounted as a whole.
    location ~ /\. {
        return 404;
    }

    location / {
        autoindex {{ "on" if cookiecutter.ifdd_unit_autoindex == "y" else "off" }};
        # Files without an extension are plain text.
        default_type text/plain;

        # "always": CORS headers on error responses too, so a browser reports
        # a missing file as 404 and not as a CORS failure.
        add_header Access-Control-Allow-Origin "{{ origin }}" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Max-Age "86400" always;
{%- if origin != "*" %}
        add_header Vary "Origin" always;
{%- endif %}
        add_header X-Content-Type-Options "nosniff" always;
        # Successful responses only; clients revalidate with the ETag.
{%- if max_age == "0" %}
        add_header Cache-Control "no-cache";
{%- else %}
        add_header Cache-Control "public, max-age={{ max_age }}";
{%- endif %}

        # CORS preflight.
        if ($request_method = OPTIONS) {
            return 204;
        }

        # A file, a namespace (directory with index.jsonld), or the
        # vocabulary of the namespace a term IRI belongs to.
        try_files $uri $uri/ $vocabulary =404;
    }
}
