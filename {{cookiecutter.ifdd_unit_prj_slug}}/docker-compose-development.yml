# Local development. Same container as in production, plus a port on
# 127.0.0.1. Without IFDD_UNIT_CONTENT_DIR it serves ./examples/json-ld.
services:
  unit:
    image: "{{ cookiecutter.ifdd_nginx_image }}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:${IFDD_UNIT_DEV_PORT:-{{ cookiecutter.ifdd_unit_dev_port }}}:8080"
    volumes:
      - "${IFDD_UNIT_CONTENT_DIR:-./examples/json-ld}:/usr/share/nginx/html:ro"
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/mime.types:/etc/nginx/mime.types:ro
    networks:
      - ext-proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.{{ cookiecutter.ifdd_unit_prj_slug }}.rule=Host(`${IFDD_UNIT_HOST:?set IFDD_UNIT_HOST in .env}`)"
      - "traefik.http.services.{{ cookiecutter.ifdd_unit_prj_slug }}.loadbalancer.server.port=8080"
      - "traefik.docker.network={{ cookiecutter.ifdd_proxy_network }}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  ext-proxy-net:
    name: {{ cookiecutter.ifdd_proxy_network }}
    external: true
