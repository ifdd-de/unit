# Production. The content comes from a separate clone of the content
# repository: IFDD_UNIT_CONTENT_DIR in .env must point to it.
services:
  unit:
    image: "{{ cookiecutter.ifdd_nginx_image }}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - "${IFDD_UNIT_CONTENT_DIR:?set IFDD_UNIT_CONTENT_DIR in .env}:/usr/share/nginx/html:ro"
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/mime.types:/etc/nginx/mime.types:ro
    networks:
      - ext-proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.{{ cookiecutter.ifdd_unit_prj_slug }}.rule=Host(`${IFDD_UNIT_HOST:?set IFDD_UNIT_HOST in .env}`)"
      - "traefik.http.services.{{ cookiecutter.ifdd_unit_prj_slug }}.loadbalancer.server.port=8080"
      # Security headers from the proxy (ifdd-de/proxy, headers.yml). Static JSON-LD: strict CSP.
      - "traefik.http.routers.{{ cookiecutter.ifdd_unit_prj_slug }}.middlewares=security-headers@file,csp-api@file"
      - "traefik.docker.network={{ cookiecutter.ifdd_proxy_network }}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: {{ cookiecutter.ifdd_unit_memory_limit }}
    restart: always

networks:
  ext-proxy-net:
    name: {{ cookiecutter.ifdd_proxy_network }}
    external: true
